<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏控制台 - {{.game_id}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-0 { background: #f0f0f0; color: #666; }
        .status-1 { background: #e6f7ff; color: #1890ff; }
        .status-2 { background: #fff7e6; color: #fa8c16; }
        .status-3 { background: #f6ffed; color: #52c41a; }
        .status-4 { background: #fff2e8; color: #fa8c16; }
        .status-5 { background: #fff1f0; color: #ff4d4f; }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff4d4f 0%, #ff7875 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
        }
        
        .btn-info {
            background: linear-gradient(135deg, #17a2b8 0%, #20c997 100%);
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-help {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .signup-list {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
        }
        
        .signup-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .signup-item:last-child {
            margin-bottom: 0;
        }
        
        .table-info {
            font-weight: bold;
            color: #333;
        }
        
        .client-info {
            color: #666;
            font-size: 14px;
        }
        
        .match-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .player-select {
            padding: 15px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            background: #fafafa;
        }
        
        .player-select h4 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .player-option {
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .player-option:hover {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        
        .player-option.selected {
            background: #1890ff;
            color: white;
            border-color: #1890ff;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .connected {
            background: #f6ffed;
            color: #52c41a;
        }
        
        .disconnected {
            background: #fff1f0;
            color: #ff4d4f;
        }
        
        .log {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-item {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        
        .log-time {
            color: #999;
        }
        
        .log-message {
            color: #333;
        }
        
        .game-status-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            font-weight: bold;
            color: #333;
        }
        
        .status-value {
            color: #666;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">连接中...</div>
    
    <div class="container">
        <div class="header">
            <h1>游戏控制台</h1>
            <div class="status" id="gameStatus">未开始</div>
        </div>
        
        <div class="content">
            <div class="section">
                <h3>游戏控制</h3>
                <button class="btn" id="startGameBtn" onclick="startSignup()">开始报名</button>
                <button class="btn" id="endSignupBtn" onclick="endSignup()" disabled>结束报名</button>
                <button class="btn btn-danger" id="endGameBtn" onclick="endGame()" disabled>结束游戏</button>
                <button class="btn btn-warning" id="announceResultBtn" onclick="announceResult()" disabled>公示结果</button>
            </div>
            
            <div class="section">
                <h3>进入游戏</h3>
                <button class="btn btn-info" id="enterGame1Btn" onclick="enterGame(1)">进入游戏1</button>
                <button class="btn btn-info" id="enterGame2Btn" onclick="enterGame(2)">进入游戏2</button>
                <button class="btn btn-info" id="enterGame3Btn" onclick="enterGame(3)">进入游戏3</button>
                <button class="btn btn-info" id="enterGame4Btn" onclick="enterGame(4)">进入游戏4</button>
                <button class="btn btn-info" id="enterGame5Btn" onclick="enterGameFive()">进入游戏5</button>
            </div>

            <div class="section" id="game5Config">
                <h3>游戏5配置</h3>
                <div class="input-group">
                    <label for="game5TableList">选中桌号列表 (tablelist)</label>
                    <input type="text" id="game5TableList" placeholder="例如：1,2,3,5">
                    <div class="input-help">多个桌号使用英文逗号分隔，仅用于“开始游戏5”指令</div>
                </div>
            </div>
            
        <div class="section">
            <h3>游戏操作</h3>
            <button class="btn btn-success" id="startBtn1" onclick="startGame(1)">开始1</button>
            <button class="btn btn-success" id="startBtn3" onclick="startGame(3)">开始3</button>
            <button class="btn btn-success" id="startBtn4" onclick="startGame(4)">开始4</button>
            <button class="btn btn-success" id="startBtn5" onclick="startGameFive()">开始5</button>
            <button class="btn btn-danger" id="endBtn1" onclick="endGameCommunication(1)">结束1</button>
            <button class="btn btn-danger" id="endBtn3" onclick="endGameCommunication(3)">结束3</button>
            <button class="btn btn-danger" id="endBtn4" onclick="endGameCommunication(4)">结束4</button>
            <button class="btn btn-danger" id="endBtn5" onclick="endGameCommunication(5)">结束5</button>
        </div>
            
            <div class="section">
                <h3>报名列表 (<span id="signupCount">0</span>人)</h3>
                <div class="signup-list" id="signupList">
                    <div style="text-align: center; color: #999; padding: 40px 0;">
                        暂无报名信息
                    </div>
                </div>
            </div>
            
            <div class="section">
                <h3>玩家匹配</h3>
                <div class="match-section">
                    <div class="player-select">
                        <h4>选择玩家1</h4>
                        <div id="player1List">
                            <div style="color: #999; text-align: center; padding: 20px 0;">
                                请先开始游戏
                            </div>
                        </div>
                    </div>  
                    <div class="player-select">
                        <h4>选择玩家2</h4>
                        <div id="player2List">
                            <div style="color: #999; text-align: center; padding: 20px 0;">
                                请先开始游戏
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn" id="confirmPlayersBtn" onclick="confirmPlayers()" disabled>确定玩家</button>
                <button class="btn btn-success" id="matchBtn" onclick="matchPlayers()" disabled>开始对战</button>
                <button class="btn btn-danger" id="endMatchBtn" onclick="endMatch()" disabled>结束对战</button>
                <button class="btn" id="tieBreakerBtn" onclick="tieBreaker()" disabled>加塞</button>
            </div>

            <div class="section">
                <h3>游戏状态</h3>
                <div class="game-status-info" id="gameStatusInfo">
                    <div class="status-item">
                        <span class="status-label">当前对战:</span>
                        <span class="status-value" id="currentMatch">无</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">玩家1选择:</span>
                        <span class="status-value" id="player1Choice">等待</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">玩家2选择:</span>
                        <span class="status-value" id="player2Choice">等待</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">游戏结果:</span>
                        <span class="status-value" id="gameResult">无</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>操作日志</h3>
                <div class="log" id="logContainer">
                    <div class="log-item">
                        <span class="log-time">[系统]</span>
                        <span class="log-message">控制台已启动</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let gameId = {{.game_id}};
        let gameStatus = 0;
        let signupList = [];
        let selectedPlayer1 = null;
        let selectedPlayer2 = null;
        let confirmedPlayers = false;
        let player1Choice = null;
        let player2Choice = null;
        let currentMatch = null;

        // 初始化WebSocket连接
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `ws://39.97.39.66:8061/ws?type=control&game_id=${gameId}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                updateConnectionStatus(true);
                addLog('WebSocket连接已建立');
                
                // 获取游戏信息
                getGameInfo();
            };
            
            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
            
            ws.onclose = function() {
                updateConnectionStatus(false);
                addLog('WebSocket连接已断开');
                
                // 5秒后重连
                setTimeout(initWebSocket, 5000);
            };
            
            ws.onerror = function(error) {
                addLog('WebSocket错误: ' + error);
            };
        }

        // 处理WebSocket消息
        function handleMessage(message) {
            switch(message.type) {
                case 'game_info':
                    updateGameInfo(message.data);
                    break;
                case 'signup_update':
                    updateSignupList(message.data);
                    break;
                case 'game_status':
                    updateGameStatus(message.data);
                    break;
                case 'player_choice':
                    handlePlayerChoice(message.data);
                    break;
                case 'game_tie':
                    handleGameTie(message.data);
                    break;
                case 'match_info':
                    handleMatchInfo(message.data);
                    break;
                case 'signup_list':
                    updateSignupList(message.data);
                    break;
                case 'enter_game_response':
                    handleEnterGameResponse(message.data);
                    break;
                case 'start_game_communication_response':
                    handleStartGameCommunicationResponse(message.data);
                    break;
                case 'end_game_communication_response':
                    handleEndGameCommunicationResponse(message.data);
                    break;
                case 'announce_result_response':
                    handleAnnounceResultResponse(message.data);
                    break;
                default:
                    addLog('收到消息: ' + JSON.stringify(message));
            }
        }

        // 更新游戏信息
        function updateGameInfo(data) {
            gameStatus = data.status;
            updateGameStatusDisplay();
            addLog('游戏信息已更新');
        }

        // 更新报名列表
        function updateSignupList(data) {
            signupList = data;
            renderSignupList();
            updatePlayerLists();
            addLog(`报名列表已更新，共${data.length}人`);
        }

        // 更新游戏状态
        function updateGameStatus(data) {
            gameStatus = data.status;
            updateGameStatusDisplay();
            addLog(`游戏状态已更新: ${getStatusText(data.status)}`);
        }

        // 渲染报名列表
        function renderSignupList() {
            const container = document.getElementById('signupList');
            const countElement = document.getElementById('signupCount');
            
            countElement.textContent = signupList.length;
            
            if (signupList.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #999; padding: 40px 0;">暂无报名信息</div>';
                return;
            }
            
            container.innerHTML = signupList.map(item => `
                <div class="signup-item">
                    <div>
                        <div class="table-info">桌号: ${item.table}</div>
                        <div class="client-info">性别: ${item.gender} | 客户端ID: ${item.client_id}</div>
                    </div>
                </div>
            `).join('');
        }

        // 更新玩家选择列表
        function updatePlayerLists() {
            const player1List = document.getElementById('player1List');
            const player2List = document.getElementById('player2List');
            
            if (signupList.length === 0) {
                player1List.innerHTML = '<div style="color: #999; text-align: center; padding: 20px 0;">暂无报名玩家</div>';
                player2List.innerHTML = '<div style="color: #999; text-align: center; padding: 20px 0;">暂无报名玩家</div>';
                return;
            }
            
            // 为玩家1创建选项
            const player1Options = signupList.map(item => `
                <div class="player-option" onclick="selectPlayer(1, '${item.table}')">
                    桌号: ${item.table} (${item.gender})
                </div>
            `).join('');
            
            // 为玩家2创建选项
            const player2Options = signupList.map(item => `
                <div class="player-option" onclick="selectPlayer(2, '${item.table}')">
                    桌号: ${item.table} (${item.gender})
                </div>
            `).join('');
            
            player1List.innerHTML = player1Options;
            player2List.innerHTML = player2Options;
        }

        // 选择玩家
        function selectPlayer(playerNum, table) {
            if (playerNum === 1) {
                selectedPlayer1 = table;
                // 更新UI - 清除所有选中状态，然后选中当前
                document.querySelectorAll('#player1List .player-option').forEach(el => el.classList.remove('selected'));
                // 找到对应的元素并选中
                document.querySelectorAll('#player1List .player-option').forEach(el => {
                    if (el.textContent.trim().includes(`桌号: ${table}`)) {
                        el.classList.add('selected');
                    }
                });
            } else {
                selectedPlayer2 = table;
                // 更新UI - 清除所有选中状态，然后选中当前
                document.querySelectorAll('#player2List .player-option').forEach(el => el.classList.remove('selected'));
                // 找到对应的元素并选中
                document.querySelectorAll('#player2List .player-option').forEach(el => {
                    if (el.textContent.trim().includes(`桌号: ${table}`)) {
                        el.classList.add('selected');
                    }
                });
            }
            
            updateMatchButton();
            addLog(`选择了玩家${playerNum}: ${table}`);
        }

        // 更新匹配按钮状态
        function updateMatchButton() {
            const confirmBtn = document.getElementById('confirmPlayersBtn');
            const matchBtn = document.getElementById('matchBtn');
            const endMatchBtn = document.getElementById('endMatchBtn');
            const tieBreakerBtn = document.getElementById('tieBreakerBtn');
            
            const canSelect = selectedPlayer1 && selectedPlayer2 && selectedPlayer1 !== selectedPlayer2 && (gameStatus === 2 || gameStatus === 3);
            const gameResult = document.getElementById('gameResult').textContent;
            const canTieBreaker = currentMatch && player1Choice && player2Choice && gameResult === '平局';
            
            confirmBtn.disabled = !canSelect;
            matchBtn.disabled = false;
            endMatchBtn.disabled = false;
            
            // 加塞按钮一直可以点击
            tieBreakerBtn.disabled = false;
            
            const canMatch = selectedPlayer1 && selectedPlayer2 && confirmedPlayers;
            addLog(`按钮状态: 可选择=${canSelect}, 可匹配=${canMatch}, 可加塞=${canTieBreaker}, 游戏结果=${gameResult}, 游戏状态=${gameStatus}, 已确认玩家=${confirmedPlayers}`);
        }

        // 更新游戏状态显示
        function updateGameStatusDisplay() {
            const statusElement = document.getElementById('gameStatus');
            const startBtn = document.getElementById('startGameBtn');
            const endSignupBtn = document.getElementById('endSignupBtn');
            const endGameBtn = document.getElementById('endGameBtn');
            const announceResultBtn = document.getElementById('announceResultBtn');
            
            statusElement.textContent = getStatusText(gameStatus);
            statusElement.className = `status status-${gameStatus}`;
            
            // 更新按钮状态
            startBtn.disabled = gameStatus !== 0;
            endSignupBtn.disabled = gameStatus !== 1;
            endGameBtn.disabled = gameStatus !== 3;
            announceResultBtn.disabled = gameStatus !== 4;
            
            // 更新匹配按钮状态
            updateMatchButton();
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                0: '未开始',
                1: '报名中',
                2: '报名结束',
                3: '游戏进行中',
                4: '已完成',
                5: '已取消'
            };
            return statusMap[status] || '未知';
        }

        // 更新连接状态
        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connectionStatus');
            if (connected) {
                statusElement.textContent = '已连接';
                statusElement.className = 'connection-status connected';
            } else {
                statusElement.textContent = '连接断开';
                statusElement.className = 'connection-status disconnected';
            }
        }

        // 添加日志
        function addLog(message) {
            const logContainer = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-message">${message}</span>`;
            logContainer.appendChild(logItem);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 开始报名
        function startSignup() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'start_signup',
                    game_id: parseInt(gameId)
                }));
                addLog('发送开始报名指令');
            }
        }

        // 结束报名
        function endSignup() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'end_signup',
                    game_id: parseInt(gameId)
                }));
                addLog('发送结束报名指令');
            }
        }

        // 确定玩家
        function confirmPlayers() {
            if (!selectedPlayer1 || !selectedPlayer2) {
                alert('请选择两个不同的玩家');
                return;
            }
            
            confirmedPlayers = true;
            currentMatch = {
                table1: selectedPlayer1,
                table2: selectedPlayer2
            };
            
            addLog(`设置confirmedPlayers=true, currentMatch=${JSON.stringify(currentMatch)}`);
            
            // 更新游戏状态显示
            document.getElementById('currentMatch').textContent = `${selectedPlayer1} vs ${selectedPlayer2}`;
            document.getElementById('player1Choice').textContent = '等待';
            document.getElementById('player2Choice').textContent = '等待';
            document.getElementById('gameResult').textContent = '无';
            
            // 重置选择状态
            player1Choice = null;
            player2Choice = null;
            
            // 发送确定玩家消息给服务器
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'confirm_players',
                    game_id: parseInt(gameId),
                    data: {
                        table1: selectedPlayer1,
                        table2: selectedPlayer2
                    }
                }));
            }
            
            updateMatchButton();
            addLog(`确定玩家: ${selectedPlayer1} vs ${selectedPlayer2}`);
        }
        
        // 开始对战
        function matchPlayers() {
            if (!confirmedPlayers) {
                alert('请先确定玩家');
                return;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'start_match',
                    game_id: parseInt(gameId),
                    data: {
                        table1: selectedPlayer1,
                        table2: selectedPlayer2
                    }
                }));
                addLog(`开始对战: ${selectedPlayer1} vs ${selectedPlayer2}`);
            }
        }
 
        // 结束对战
        function endMatch() {
            if (!player1Choice || !player2Choice) {
                alert('请等待两个玩家都做出选择');
                return;
            }
            
            // 判断实际的对局结果
            const result = judgeGame(player1Choice, player2Choice);
            let winner = '';
            
            if (result === '平局') {
                alert('游戏平局，请使用加塞功能重新开始');
                return;
            } else if (result.includes('胜')) {
                // 从结果中提取获胜者
                if (result.includes(getChoiceText(player1Choice))) {
                    winner = selectedPlayer1;
                } else {
                    winner = selectedPlayer2;
                }
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'end_match',
                    game_id: parseInt(gameId),
                    data: {
                        table1: selectedPlayer1,
                        table2: selectedPlayer2,
                        winner: winner,
                        result: result
                    }
                }));
                addLog(`结束对战: ${selectedPlayer1} vs ${selectedPlayer2}, 获胜者: ${winner}, 结果: ${result}`);
            }
        }
        
        // 加塞（平局处理）
        function tieBreaker() {
            if (!currentMatch) {
                alert('没有当前对战');
                return;
            }
            
            console.log('发送加塞消息:', selectedPlayer1, selectedPlayer2);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'tie_breaker',
                    game_id: parseInt(gameId),
                    data: {
                        table1: selectedPlayer1,
                        table2: selectedPlayer2
                    }
                }));
                addLog(`加塞: ${selectedPlayer1} vs ${selectedPlayer2}`);
                
                // 清空对战相关信息
                player1Choice = null;
                player2Choice = null;
                document.getElementById('player1Choice').textContent = '等待选择';
                document.getElementById('player2Choice').textContent = '等待选择';
                document.getElementById('gameResult').textContent = '等待结果';
                
                // 更新按钮状态
                updateMatchButton();
            }
        }
        
        // 处理玩家选择
        function handlePlayerChoice(data) {
            const { table, choice } = data;
            
            if (table === selectedPlayer1) {
                player1Choice = choice;
                document.getElementById('player1Choice').textContent = getChoiceText(choice);
            } else if (table === selectedPlayer2) {
                player2Choice = choice;
                document.getElementById('player2Choice').textContent = getChoiceText(choice);
            }
            
            // 如果两个玩家都选择了，判断胜负
            if (player1Choice && player2Choice) {
                const result = judgeGame(player1Choice, player2Choice);
                document.getElementById('gameResult').textContent = result;
                addLog(`游戏结果: ${result}`);
                
                // 如果是平局，自动启用加塞按钮
                if (result === '平局') {
                    document.getElementById('tieBreakerBtn').disabled = false;
                    addLog('游戏平局，可以使用加塞功能');
                }
            }
            
            updateMatchButton();
        }
        
        // 获取选择文本
        function getChoiceText(choice) {
            const choiceMap = {
                'rock': '✊ 石头',
                'scissors': '✌️ 剪刀',
                'paper': '✋ 布'
            };
            return choiceMap[choice] || choice;
        }
        
        // 判断游戏胜负
        function judgeGame(choice1, choice2) {
            if (choice1 === choice2) {
                return '平局';
            }
            
            const winMap = {
                'rock': 'scissors',
                'scissors': 'paper',
                'paper': 'rock'
            };
            
            if (winMap[choice1] === choice2) {
                return `${getChoiceText(choice1)} 胜 ${getChoiceText(choice2)}`;
            } else {
                return `${getChoiceText(choice2)} 胜 ${getChoiceText(choice1)}`;
            }
        }
        
        // 处理平局
        function handleGameTie(data) {
            addLog('游戏平局，可以加塞');
            document.getElementById('gameResult').textContent = '平局 - 可以加塞';
        }
        
        // 处理比赛信息（用于恢复状态）
        function handleMatchInfo(data) {
            if (data.table1 && data.table2) {
                selectedPlayer1 = data.table1;
                selectedPlayer2 = data.table2;
                confirmedPlayers = true;
                currentMatch = true;
                
                // 更新显示
                document.getElementById('currentMatch').textContent = `${selectedPlayer1} vs ${selectedPlayer2}`;
                document.getElementById('player1Choice').textContent = '等待选择';
                document.getElementById('player2Choice').textContent = '等待选择';
                document.getElementById('gameResult').textContent = '等待结果';
                
                // 如果有结果，显示结果
                if (data.winner && data.result) {
                    document.getElementById('gameResult').textContent = data.result;
                    if (data.winner === selectedPlayer1) {
                        document.getElementById('player1Choice').textContent = '已选择';
                    } else if (data.winner === selectedPlayer2) {
                        document.getElementById('player2Choice').textContent = '已选择';
                    }
                }
                
                updateMatchButton();
                addLog(`恢复比赛状态: ${selectedPlayer1} vs ${selectedPlayer2}`);
            }
        }

        // 结束游戏
        function endGame() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'end_game',
                    game_id: parseInt(gameId)
                }));
                addLog('发送结束游戏指令');
            }
        }

        // 公示结果
        function announceResult() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'announce_result',
                    game_id: parseInt(gameId)
                }));
                addLog('发送公示结果指令');
            }
        }

        // 获取游戏信息
        function getGameInfo() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'get_game_info',
                    game_id: parseInt(gameId)
                }));
            }
        }

        // 进入游戏
        function enterGame(gameType, extraData = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'enter_game',
                    game_id: parseInt(gameId),
                    data: {
                        message: `进入游戏${gameType}请求`,
                        game_type: gameType,
                        timestamp: new Date().toISOString(),
                        ...extraData
                    }
                }));
                addLog(`发送进入游戏${gameType}请求`);
            }
        }

        // 进入游戏5（需要选择topic_id）
        function enterGameFive() {
            enterGame(5);
            addLog('发送进入游戏5请求（无需topic_id）');
        }

        // 处理进入游戏响应
        function handleEnterGameResponse(data) {
            addLog(`收到进入游戏${data.game_type}响应: ${data.message} (客户端ID: ${data.client_id}, 服务器时间: ${data.server_time})`);
        }

        // 开始游戏
        function startGame(gameType, extraData = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'start_game_communication',
                    data: {
                        message: `开始游戏${gameType}请求`,
                        game_type: gameType,
                        timestamp: new Date().toISOString(),
                        ...extraData
                    }
                }));
                addLog(`发送开始游戏${gameType}请求`);
            }
        }
        
        function startGameFive() {
            const listInput = document.getElementById('game5TableList');
            if (!listInput) {
                alert('未找到tablelist输入框');
                return;
            }
            const raw = (listInput.value || '').trim();
            if (!raw) {
                alert('请输入自定义数据，例如 3,4 或 {"table1":1,"table2":5}');
                return;
            }
            let payload;
            try {
                payload = JSON.parse(raw);
            } catch (e) {
                const items = raw.split(',').map(item => item.trim()).filter(Boolean);
                if (items.length === 0) {
                    alert('请输入有效的数据');
                    return;
                }
                payload = items.map(val => {
                    const num = parseInt(val, 10);
                    return isNaN(num) ? val : num;
                });
            }
            startGame(5, { data: payload });
            addLog(`发送开始游戏5请求，data=${raw}`);
        }
 
        // 结束游戏通信
        function endGameCommunication(gameType) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'end_game_communication',
                    data: {
                        message: `结束游戏${gameType}请求`,
                        game_type: gameType,
                        timestamp: new Date().toISOString()
                    }
                }));
                addLog(`发送结束游戏${gameType}请求`);
            }
        }

        // 处理开始游戏通信响应
        function handleStartGameCommunicationResponse(data) {
            addLog(`收到开始游戏${data.game_type}响应: ${data.message} (客户端ID: ${data.client_id}, 服务器时间: ${data.server_time})`);
        }

        // 处理结束游戏通信响应
        function handleEndGameCommunicationResponse(data) {
            addLog(`收到结束游戏${data.game_type}响应: ${data.message} (客户端ID: ${data.client_id}, 服务器时间: ${data.server_time})`);
        }

        // 处理公示结果响应
        function handleAnnounceResultResponse(data) {
            addLog(`收到公示结果响应: ${data.message} (奖品名称: ${data.prize_name}, 客户端ID: ${data.client_id}, 服务器时间: ${data.server_time})`);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initWebSocket();
        });
    </script>
</body>
</html>
